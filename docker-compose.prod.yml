# Production stack on our own VPS (on-premise). Usage on the server:
#   cp deploy/.env.prod.example .env   # fill in secrets once
#   docker compose -f docker-compose.prod.yml up -d --build
# All ports are bound to 127.0.0.1: the host nginx terminates HTTPS and proxies
# quizlive / uptime / errors / logs subdomains to them (deploy/nginx/quizlive.conf).
name: quizlive-prod

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-glitchtip.sh:/docker-entrypoint-initdb.d/10-glitchtip.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 384m

  server:
    build: ./server
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: 2           # host nginx -> web nginx -> server
      APP_VERSION: ${APP_VERSION:-dev}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGINS: https://${APP_DOMAIN}
      COOKIE_SECURE: "true"
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-30}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOKI_URL: http://loki:3100
    depends_on:
      db: { condition: service_healthy }
      loki: { condition: service_started }
    mem_limit: 256m

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: ""
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:8110:80"
    depends_on: [server]
    mem_limit: 64m

  # ---- monitoring ----
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.9-slim
    restart: unless-stopped
    logging: *logging
    environment:
      UPTIME_KUMA_DB_TYPE: sqlite   # skip the interactive database choice on first start
    ports:
      - "127.0.0.1:8111:3001"
    volumes:
      - kuma:/app/data
    mem_limit: 256m

  glitchtip:
    image: glitchtip/glitchtip:6.2.6
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/glitchtip
      SERVER_ROLE: all_in_one # one process: web + task worker + scheduler, runs migrations on start
      VALKEY_URL: ""          # no Redis/Valkey: cache and task queue live in PostgreSQL
      GRANIAN_WORKERS_MAX_RSS: "400"
      ALLOWED_HOSTS: errors.${APP_DOMAIN},localhost,127.0.0.1
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      GLITCHTIP_DOMAIN: https://errors.${APP_DOMAIN}
      DEFAULT_FROM_EMAIL: glitchtip@${APP_DOMAIN}
      EMAIL_URL: consolemail://
      ENABLE_USER_REGISTRATION: "false"
      ENABLE_ORGANIZATION_CREATION: "false"
      GLITCHTIP_RETENTION_DAYS: "30"
      PORT: 8000
    ports:
      - "127.0.0.1:8112:8000"
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 512m

  loki:
    image: grafana/loki:3.6.21
    restart: unless-stopped
    logging: *logging
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./deploy/loki/config.yml:/etc/loki/config.yml:ro
      - loki:/loki
    mem_limit: 256m

  grafana:
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    logging: *logging
    environment:
      GF_SERVER_ROOT_URL: https://logs.${APP_DOMAIN}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "127.0.0.1:8113:3000"
    volumes:
      - grafana:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [loki]
    mem_limit: 384m

# Explicit subnet: the VPS has used up Docker's default address pools.
networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-10.203.110.0/24}

volumes:
  pgdata:
  kuma:
  loki:
  grafana:
