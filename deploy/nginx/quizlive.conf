# Host nginx (VPS): HTTPS termination for QuizLive and its monitoring tools.
# Installed by deploy/setup-host.sh; certificate from Let's Encrypt (certbot, webroot).
# Containers listen on 127.0.0.1 only (see docker-compose.prod.yml).

server {
    listen 80;
    listen [::]:80;
    server_name quizlive.cloudyyy.tech uptime.quizlive.cloudyyy.tech errors.quizlive.cloudyyy.tech logs.quizlive.cloudyyy.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Shared TLS settings for every server block below
# (certificate covers all four names).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quizlive.cloudyyy.tech;
    include /etc/nginx/snippets/quizlive-tls.conf;

    location / {
        proxy_pass http://127.0.0.1:8110;
        include /etc/nginx/snippets/quizlive-proxy.conf;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uptime.quizlive.cloudyyy.tech;
    include /etc/nginx/snippets/quizlive-tls.conf;

    location / {
        proxy_pass http://127.0.0.1:8111;
        include /etc/nginx/snippets/quizlive-proxy.conf;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name errors.quizlive.cloudyyy.tech;
    include /etc/nginx/snippets/quizlive-tls.conf;
    client_max_body_size 20M;   # Sentry SDK envelopes / source maps

    location / {
        proxy_pass http://127.0.0.1:8112;
        include /etc/nginx/snippets/quizlive-proxy.conf;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name logs.quizlive.cloudyyy.tech;
    include /etc/nginx/snippets/quizlive-tls.conf;

    location / {
        proxy_pass http://127.0.0.1:8113;
        include /etc/nginx/snippets/quizlive-proxy.conf;
    }
}
